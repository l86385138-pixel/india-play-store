name: Restore Previous APK Download
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore previous download handler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="const downloadUrl=a.apk_url+sep+'download='+encodeURIComponent(fileName);if(!confirm('APK download start karein?')){b.disabled=false;b.textContent='Submit & Download';return}const dl=document.createElement('a');dl.href=downloadUrl;dl.download=fileName;dl.rel='noopener';dl.style.display='none';document.body.appendChild(dl);dl.click();setTimeout(()=>dl.remove(),3000)"
          new="const downloadUrl=a.apk_url+sep+'download='+encodeURIComponent(fileName);window.location.assign(downloadUrl)"
          if old not in s:
              raise SystemExit('Previous confirmation handler not found; no change made.')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit restore
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Restore previous APK download behavior' || exit 0
          git push
