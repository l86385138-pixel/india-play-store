name: Build India Play Store Wrapper APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-wrapper/**'
      - '.github/workflows/build-wrapper-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Generate Gradle wrapper
        working-directory: android-wrapper
        run: gradle wrapper --gradle-version 8.10.2
      - name: Build debug APK
        working-directory: android-wrapper
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: india-play-store-wrapper-apk
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
