name: Fix Enquiry Admin
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch enquiry section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<section id="enq" style="display:none"><div id="enquiryList"></div></section>'
          new='''<section id="enq" style="display:none"><div style="display:flex;gap:10px;flex-wrap:wrap;margin:14px 0"><input id="enquirySearch" type="search" placeholder="Search APK enquiries..." style="flex:1;min-width:220px;padding:11px 12px;border:1px solid #dce1ea;border-radius:10px;outline:none"><button class="danger" type="button" onclick="deleteAllEnquiries()">Delete All</button></div><div id="enquiryList"></div></section>'''
          if old not in s:
              raise SystemExit('Enquiry section marker not found')
          s=s.replace(old,new,1)
          marker="async function loadEnquiries(){"
          pos=s.find(marker)
          if pos<0: raise SystemExit('loadEnquiries marker not found')
          # Replace the existing loadEnquiries function through the next uploadForm listener.
          end=s.find("$('uploadForm').addEventListener",pos)
          if end<0: raise SystemExit('uploadForm marker not found')
          fn='''async function loadEnquiries(){const r=await db.from('download_requests').select('*').order('created_at',{ascending:false});if(r.error){console.error(r.error);$('enquiryList').innerHTML='<div class="empty">Enquiries could not be loaded.</div>';return}window.enquiries=r.data||[];renderEnquiries()}function renderEnquiries(){const term=String($('enquirySearch')?.value||'').toLowerCase().trim();const data=(window.enquiries||[]).filter(x=>[x.app_name,x.user_name,x.mobile,x.email].some(v=>String(v||'').toLowerCase().includes(term)));$('enquiryList').innerHTML=data.map(x=>`<div class="enquiry"><strong>${esc(x.app_name)}</strong><br>${esc(x.user_name)} · ${esc(x.mobile)} · ${esc(x.email)}<div style="margin-top:9px"><button class="danger" type="button" onclick="deleteEnquiry('${x.id}')">Delete Enquiry</button></div></div>`).join('')||'<div class="empty">No matching APK enquiries.</div>'}async function deleteEnquiry(id){if(!confirm('Delete this APK enquiry?'))return;const r=await db.from('download_requests').delete().eq('id',id);if(r.error){alert('Delete failed: '+r.error.message);return}await loadEnquiries()}async function deleteAllEnquiries(){const data=window.enquiries||[];if(!data.length){alert('No enquiries to delete.');return}if(!confirm('Delete all APK enquiries?'))return;const r=await db.from('download_requests').delete().not('id','is',null);if(r.error){alert('Delete all failed: '+r.error.message);return}await loadEnquiries()}'''
          s=s[:pos]+fn+s[end:]
          s=s.replace("$('search').addEventListener('input',e=>{q=e.target.value.toLowerCase().trim();render()});", "$('search').addEventListener('input',e=>{q=e.target.value.toLowerCase().trim();render()});document.addEventListener('input',e=>{if(e.target&&e.target.id==='enquirySearch')renderEnquiries()});",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add APK enquiry search and delete' || exit 0
          git push
