name: Fix Mobile APK Download
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update APK URL to forced download
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="const link=document.createElement('a');link.href=a.apk_url;link.download=(a.file_name||a.name||'app').replace(/[^a-zA-Z0-9._-]/g,'_')+'.apk';link.rel='noopener';link.style.display='none';document.body.appendChild(link);link.click();setTimeout(()=>link.remove(),2000)"
          new="const fileName=(a.file_name||a.name||'app').replace(/[^a-zA-Z0-9._-]/g,'_');const sep=a.apk_url.includes('?')?'&':'?';const downloadUrl=a.apk_url+sep+'download='+encodeURIComponent(fileName);window.location.assign(downloadUrl)"
          if old not in s:
              raise SystemExit('Expected download handler not found; no change made.')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Force APK download on mobile browsers' || exit 0
          git push
