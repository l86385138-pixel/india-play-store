name: Direct APK Download
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch APK download handler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="closeModal('downloadModal');window.location.href=a.apk_url"
          new="closeModal('downloadModal');const link=document.createElement('a');link.href=a.apk_url;link.download=(a.file_name||a.name||'app').replace(/[^a-zA-Z0-9._-]/g,'_')+'.apk';link.rel='noopener';link.style.display='none';document.body.appendChild(link);link.click();setTimeout(()=>link.remove(),2000)"
          if old not in s:
              raise SystemExit('APK download handler not found; no change made.')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Start APK download directly on mobile' || exit 0
          git push
