<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INDIA Play STORE</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f5f7fb;color:#172033}button,input,select,textarea{font:inherit}.top{background:#fff;border-bottom:1px solid #e7eaf0;position:sticky;top:0;z-index:20}.nav,.wrap,.hero{max-width:1180px;margin:auto}.nav{padding:14px 20px;display:flex;align-items:center;gap:18px}.logo{font-size:23px;font-weight:800;color:#29235f;white-space:nowrap}.search{flex:1;max-width:520px}.search input{width:100%;padding:12px 16px;border:1px solid #dfe3eb;border-radius:12px;outline:none;background:#f8f9fc}.admin-btn,.primary{border:0;border-radius:10px;padding:11px 16px;background:#635bff;color:#fff;font-weight:700;cursor:pointer}.admin-btn{background:#172033}.hero{padding:28px 20px 18px}.hero-box{background:linear-gradient(135deg,#635bff,#8b5cf6);color:#fff;border-radius:24px;padding:34px 38px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 15px 35px #635bff25}.hero h1{margin:0 0 8px;font-size:34px}.hero p{margin:0;opacity:.9}.hero-icon{font-size:64px}.wrap{padding:0 20px 50px}.chips{display:flex;gap:10px;overflow:auto;padding:8px 0 20px}.chip{border:1px solid #e0e4ec;background:#fff;padding:9px 15px;border-radius:999px;cursor:pointer;white-space:nowrap}.chip.active{background:#635bff;color:#fff;border-color:#635bff}.section-title{display:flex;justify-content:space-between;align-items:center;margin:12px 0}.section-title h2{margin:0}.count,.muted{color:#778097;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border:1px solid #e7eaf0;border-radius:18px;padding:18px;box-shadow:0 4px 14px #17203308}.apphead{display:flex;gap:14px;align-items:center}.icon{width:68px;height:68px;border-radius:17px;display:grid;place-items:center;font-size:34p x 11px;border-radius:8px;cursor:pointer}.enquiry{border:1px solid #e0e4ec;border-radius:14px;padding:13px;margin-top:10px}.demo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.demo-grid img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;cursor:pointer}.footer{text-align:center;color:#8891a3;padding:28px 20px;border-top:1px solid #e7eaf0;background:#fff}.busy{opacity:.65;pointer-events:none}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:580px){.nav{flex-wrap:wrap}.search{order:3;flex-basis:100%;max-width:none}.grid{grid-template-columns:1fr}.hero h1{font-size:27px}.demo-grid{grid-template-columns:repeat(2,1fr)}.actions{grid-template-columns:1fr 1fr 42px}}</style></head><body><header class="top"><div class="nav"><div class="logo">🇮🇳 INDIA Play STORE</div><div class="search"><input id="search" type="search" placeholder="Search apps..."></div><button class="admin-btn" onclick="openModal('adminModal')">Admin</button></div></header><section class="hero"><div class="hero-box"><div><h1>Discover Apps You Love</h1><p>Browse apps, view demo images and download instantly.</p></div><div class="hero-icon">📱</div></div></section><main class="wrap"><div class="chips" id="chips"></div><div class="section-title"><h2 id="sectionTitle">All Apps</h2><span class="count" id="count"></span></div><div class="grid" id="appGrid"></div></main><footer class="footer">© 2026 INDIA Play STORE</footer><div class="modal" id="downloadModal"><div class="modal-box"><div class="modal-head"><h2>Download App</h2><button class="close" onclick="closeModal('downloadModal')">×</button></div><p id="downloadAppName" class="muted"></p><div class="notice">Download शुरू करने के लिए अपना नाम, मोबाइल नंबर और ईमेल दें।</div><form class="form" id="downloadForm"><input type="hidden" id="selectedAppId"><label>Your Name</label><input id="userName" required><label>Mobile Number</label><input id="userMobile" required inputmode="tel"><label>Email ID</label><input id="userEmail" required type="email"><button class="primary">Submit & Download</button></form></div></div><div class="modal" id="demoModal"><div class="modal-box"><div class="modal-head"><h2 id="demoTitle">App Demo</h2><button class="close" onclick="closeModal('demoModal')">×</button></div><div id="demoGrid" class="demo-grid"></div></div></div><div class="modal" id="adminModal"><div class="modal-box"><div class="modal-head"><h2>Admin Panel</h2><button class="close" onclick="closeModal('adminModal')">×</button></div><div id="adminLogin"><form class="form" id="loginForm"><label>User ID</label><input id="adminUser" required><label>Password</label><input id="adminPass" required type="password"><button class="primary">Login</button></form></div><div class="admin-panel" id="adminPanel"><div class="tabs"><button class="tab active" onclick="showTab('apps')">Manage Apps</button><button class="tab" onclick="showTab('enq')">Enquiries</button></div><section id="apps"><form class="form" id="uploadForm"><label>App Name</label><input id="appName" required><label>Logo</label><input id="logo" type="file" accept="image/*" required><label>Category</label><select id="category"><option>Tools</option><option>Education</option><option>Entertainment</option><option>Business</option><option>Games</option><option>Social</option></select><label>Description</label><textarea id="description" required></textarea><label>Version</label><input id="version" value="1.0.0"><label>Size</label><input id="size" value="25 MB"><label>APK File</label><input id="apk" type="file" accept=".apk,application/vnd.android.package-archive" required><label>Demo Images</label><input id="demoImages" type="file" accept="image/*" multiple><button class="primary">Add App</button></form><div class="admin-list" id="adminList"></div></section><section id="enq" style="display:none"><div style="display:flex;gap:10px;flex-wrap:wrap;margin:14px 0"><input id="enquirySearch" type="search" placeholder="Search APK enquiries..." style="flex:1;min-width:220px;padding:11px 12px;border:1px solid #dce1ea;border-radius:10px;outline:none"><button class="danger" type="button" onclick="deleteAllEnquiries()">Delete All</button></div><div id="enquiryList"></div></section></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://rpzmnfvtfikiabowjnzj.supabase.co','sb_publishable_fmCJZdmON1PaC5ZduHuYBQ_IQbWvxx8');let apps=[],activeCat='All',q='';const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function openModal(id){$(id).classList.add('show')}function closeModal(id){$(id).classList.remove('show')}async function loadApps(){const r=await db.from('apps').select('*').order('created_at',{ascending:false});if(r.error){console.error(r.error);$('appGrid').innerHTML='<div class="empty" style="grid-column:1/-1">Apps could not be loaded.</div>';return}apps=r.data||[];render()}function render(){const cats=['All',...new Set(apps.map(a=>a.category).filter(Boolean))];$('chips').innerHTML=cats.map(c=>`<button class="chip ${c===activeCat?'active':''}" onclick="activeCat='${esc(c)}';render()">${esc(c)}</button>`).join('');const list=apps.filter(a=>(activeCat==='All'||a.category===activeCat)&&((a.name||'').toLowerCase().includes(q)||(a.description||'').toLowerCase().includes(q)));$('count').textContent=list.length+' apps';$('appGrid').innerHTML=list.length?list.map(a=>{const imgs=Array.isArray(a.demo_images)?a.demo_images:[];return `<article class="card"><div class="apphead"><div class="icon">${a.logo_url?`<img src="${esc(a.logo_url)}" alt="">`:'📱'}</div><div><h3>${esc(a.name)}</h3><div class="muted">${esc(a.category)}</div></div></div><div class="desc">${esc(a.description)}</div><div class="meta"><span>Version ${esc(a.version||'1.0.0')}</span><span>${esc(a.size||'—')}</span></div><div class="actions">${imgs.length?`<button class="demo" onclick="showDemo('${a.id}')">Demo</button>`:'<span></span>'}<button class="download" onclick="startDownload('${a.id}')">Download</button><button class="share" aria-label="Share app" title="Share app" onclick="shareApp('${a.id}')">⋮</button></div></article>`}).join(''):'<div class="empty" style="grid-column:1/-1">No apps found.</div>'}function startDownload(id){const a=apps.find(x=>x.id===id);if(!a)return;$('selectedAppId').value=id;$('downloadAppName').textContent='Selected app: '+a.name;$('downloadForm').reset();$('selectedAppId').value=id;openModal('downloadModal')}async function shareApp(id){const a=apps.find(x=>x.id===id);if(!a)return;const url=new URL(location.href);url.search='';url.hash='';url.searchParams.set('app',a.id);url.searchParams.set('share','1');const shareData={title:a.name,text:'Check out '+a.name+' on INDIA Play STORE',url:url.toString()};try{if(navigator.share){await navigator.share(shareData)}else{await navigator.clipboard.writeText(url.toString());alert('App share link copied. Ab aap ise WhatsApp, Telegram ya kisi friend ko send kar sakte hain.')}}catch(e){if(e&&e.name==='AbortError')return;try{await navigator.clipboard.writeText(url.toString());alert('Share link copied.')}catch(_){prompt('Copy this app link:',url.toString())}}}function openSharedApp(){const id=new URLSearchParams(location.search).get('app');if(id){const a=apps.find(x=>String(x.id)===String(id));if(a){setTimeout(()=>startDownload(a.id),250)}}}$('search').addEventListener('input',e=>{q=e.target.value.toLowerCase().trim();render()});document.addEventListener('input',e=>{if(e.target&&e.target.id==='enquirySearch')renderEnquiries()});$('downloadForm').addEventListener('submit',async e=>{e.preventDefault();const a=apps.find(x=>String(x.id)===String($('selectedAppId').value));if(!a)return;const b=e.submitter;b.disabled=true;b.textContent='Saving...';const r=await db.from('download_requests').insert({app_id:a.id,app_name:a.name,user_name:$('userName').value.trim(),mobile:$('userMobile').value.trim(),email:$('userEmail').value.trim(),user_agent:navigator.userAgent});if(r.error){alert('Enquiry save failed. Please try again.');b.disabled=false;b.textContent='Submit & Download';return}closeModal('downloadModal');window.location.href=a.apk_url});function showDemo(id){const a=apps.find(x=>String(x.id)===String(id));if(!a)return;$('demoTitle').textContent=a.name;const imgs=Array.isArray(a.demo_images)?a.demo_images:[];$('demoGrid').innerHTML=imgs.map(u=>`<img src="${esc(u)}" alt="Demo" onclick="window.open('${esc(u)}','_blank')">`).join('');openModal('demoModal')}$('loginForm').addEventListener('submit',e=>{e.preventDefault();if($('adminUser').value.normalize('NFKC').replace(/\s+/g,'')==='900697701'&&$('adminPass').value.normalize('NFKC').replace(/\s+/g,'')==='Lavk@2345'){$('adminLogin').style.display='none';$('adminPanel').classList.add('show');renderAdmin();loadEnquiries()}else alert('Invalid Admin credentials')});function showTab(t){$('apps').style.display=t==='apps'?'block':'none';$('enq').style.display=t==='enq'?'block':'none';if(t==='enq')loadEnquiries()}function renderAdmin(){$('adminList').innerHTML=apps.map(a=>`<div class="admin-row"><span>${esc(a.name)}</span><button class="danger" onclick="deleteApp('${a.id}')">Delete</button></div>`).join('')||'<div class="muted">No apps uploaded.</div>'}async function deleteApp(id){if(!confirm('Delete this app?'))return;const r=await db.from('apps').delete().eq('id',id);if(r.error)alert(r.error.message);else{await loadApps();renderAdmin()}}async function loadEnquiries(){const r=await db.from('download_requests').select('*').order('created_at',{ascending:false});if(r.error){console.error(r.error);$('enquiryList').innerHTML='<div class="empty">Enquiries could not be loaded.</div>';return}window.enquiries=r.data||[];renderEnquiries()}function renderEnquiries(){const term=String($('enquirySearch')?.value||'').toLowerCase().trim();const data=(window.enquiries||[]).filter(x=>[x.app_name,x.user_name,x.mobile,x.email].some(v=>String(v||'').toLowerCase().includes(term)));$('enquiryList').innerHTML=data.map(x=>`<div class="enquiry"><strong>${esc(x.app_name)}</strong><br>${esc(x.user_name)} · ${esc(x.mobile)} · ${esc(x.email)}<div style="margin-top:9px"><button class="danger" type="button" onclick="deleteEnquiry('${x.id}')">Delete Enquiry</button></div></div>`).join('')||'<div class="empty">No matching APK enquiries.</div>'}async function deleteEnquiry(id){if(!confirm('Delete this APK enquiry?'))return;const r=await db.from('download_requests').delete().eq('id',id);if(r.error){alert('Delete failed: '+r.error.message);return}await loadEnquiries()}async function deleteAllEnquiries(){const data=window.enquiries||[];if(!data.length){alert('No enquiries to delete.');return}if(!confirm('Delete all APK enquiries?'))return;const r=await db.from('download_requests').delete().not('id','is',null);if(r.error){alert('Delete all failed: '+r.error.message);return}await loadEnquiries()}$('uploadForm').addEventListener('submit',async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;b.textContent='Uploading...';try{const t=Date.now(),logo=$('logo').files[0],apk=$('apk').files[0];if(!logo||!apk)throw Error('Logo and APK are required');const lp=t+'-'+logo.name.replace(/[^a-zA-Z0-9._-]/g,'_'),ap=t+'-'+apk.name.replace(/[^a-zA-Z0-9._-]/g,'_');let r=await db.storage.from('app-logos').upload(lp,logo);if(r.error)throw r.error;r=await db.storage.from('app-files').upload(ap,apk,{contentType:'application/vnd.android.package-archive'});if(r.error)throw r.error;const logoUrl=db.storage.from('app-logos').getPublicUrl(lp).data.publicUrl,apkUrl=db.storage.from('app-files').getPublicUrl(ap).data.publicUrl,demos=[];for(const f of $('demoImages').files){const p=t+'-'+Math.random().toString(36).slice(2)+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');const z=await db.storage.from('app-images').upload(p,f);if(!z.error)demos.push(db.storage.from('app-images').getPublicUrl(p).data.publicUrl)}r=await db.from('apps').insert({name:$('appName').value.trim(),icon:'📱',category:$('category').value,description:$('description').value.trim(),version:$('version').value.trim(),size:$('size').value.trim(),apk_url:apkUrl,logo_url:logoUrl,demo_images:demos,file_name:apk.name,apk_path:ap,logo_path:lp});if(r.error)throw r.error;$('uploadForm').reset();alert('App uploaded successfully.');await loadApps();renderAdmin()}catch(err){console.error(err);alert('Upload failed: '+(err.message||err))}finally{b.disabled=false;b.textContent='Add App'}});loadApps().then(openSharedApp);</script></body></html>
